<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Lilith sigil — glowing emblem for the current Moon Child">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0c1320"/>
      <stop offset="48%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="lvig" cx="18%" cy="45%" r="70%">
      <stop offset="0%"  stop-color="#3a1130" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0a0f18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%"  stop-color="#f3cf63"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </radialGradient>
    <filter id="lglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lglowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lpanel"><rect x="0" y="0" width="1000" height="220" rx="12"/></clipPath>
    <mask id="crescentMask" maskUnits="userSpaceOnUse" x="-500" y="-500" width="1000" height="1000">
      <rect x="-500" y="-500" width="1000" height="1000" fill="black"/>
      <circle cx="0" cy="0" r="40" fill="white"/>
      <circle cx="17" cy="-9" r="34" fill="black"/>
    </mask>
    <g id="lstar"><path d="M0,-5 L1.1,-1.1 L5,0 L1.1,1.1 L0,5 L-1.1,1.1 L-5,0 L-1.1,-1.1 Z" fill="#d4a017"/></g>
  </defs>

  <rect width="1000" height="220" rx="12" fill="url(#lbg)"/>
  <g clip-path="url(#lpanel)">
    <rect width="1000" height="220" fill="url(#lvig)"/>

    <!-- drifting stars -->
    <g>
      <use href="#lstar" transform="translate(330,34) scale(0.4)" opacity="0.4"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.6s" repeatCount="indefinite"/></use>
      <use href="#lstar" transform="translate(520,26) scale(0.32)" opacity="0.4"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="4.2s" repeatCount="indefinite"/></use>
      <use href="#lstar" transform="translate(900,44) scale(0.36)" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.1s" repeatCount="indefinite"/></use>
      <use href="#lstar" transform="translate(760,180) scale(0.3)" opacity="0.35"><animate attributeName="opacity" values="0.5;0.18;0.5" dur="4.8s" repeatCount="indefinite"/></use>
    </g>

    <!-- ============ LEFT: Lilith sigil ============ -->
    <g transform="translate(150,110)">
      <circle r="80" fill="none" stroke="#d4a017" stroke-width="1" opacity="0.22" stroke-dasharray="1.4 10"/>
      <circle r="62" fill="none" stroke="#d4a017" stroke-width="0.8" opacity="0.18"/>

      <!-- crescent (Black Moon) -->
      <circle cx="0" cy="0" r="40" fill="url(#moonGrad)" mask="url(#crescentMask)" filter="url(#lglowStrong)">
        <animate attributeName="opacity" values="0.86;1;0.86" dur="3.2s" repeatCount="indefinite"/>
      </circle>

      <!-- owl-eye accents -->
      <circle cx="-56" cy="2" r="2.6" fill="#4ade80"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="56" cy="2" r="2.6" fill="#4ade80"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/></circle>

      <text x="0" y="94" text-anchor="middle" fill="#d4a017" opacity="0.75" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="4">LILITH</text>
    </g>

    <!-- ============ RIGHT: type block ============ -->
    <text x="330" y="80" fill="#4ade80" opacity="0.85" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="4">BLACK MOON <tspan fill="#5b6573">//</tspan> DARK VESSEL <tspan fill="#5b6573">//</tspan> <tspan fill="#d4a017">ACTIVE</tspan></text>

    <text x="328" y="132" fill="#d4a017" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="42" font-weight="700" letter-spacing="2" filter="url(#lglowStrong)">MOON CHILD
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3.6s" repeatCount="indefinite"/>
    </text>

    <text x="330" y="162" fill="#9fb0c4" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2">current vessel <tspan fill="#d4a017">/</tspan> Cody Churchwell</text>

    <text x="330" y="192" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="0.5">
      <tspan fill="#4ade80">&#8250; </tspan><tspan fill="#c0c8d4">made of harder stuff than the environment</tspan>
    </text>
    <rect x="708" y="181" width="9" height="14" fill="#4ade80">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="999" height="219" rx="12" fill="none" stroke="#d4a017" stroke-width="1" opacity="0.18"/>
</svg>
