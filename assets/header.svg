<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" fill="#0a0e14" rx="6"/>

  <!-- Geometric Owl -->
  <g transform="translate(400, 58)" fill="none" stroke="#d4a017" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left eye outer -->
    <circle cx="-14" cy="0" r="11" opacity="0.9"/>
    <!-- Left eye inner (pupil) -->
    <circle cx="-14" cy="0" r="4.5" fill="#d4a017" opacity="0.7"/>
    <!-- Right eye outer -->
    <circle cx="14" cy="0" r="11" opacity="0.9"/>
    <!-- Right eye inner (pupil) -->
    <circle cx="14" cy="0" r="4.5" fill="#d4a017" opacity="0.7"/>
    <!-- Brow / ear tufts -->
    <path d="M-30,-14 L-14,-6 L0,-16 L14,-6 L30,-14" stroke-width="1.8"/>
    <!-- Beak -->
    <path d="M-4,8 L0,15 L4,8" stroke-width="1.5"/>
    <!-- Subtle face disc lines -->
    <path d="M-25,4 Q-18,18 0,20 Q18,18 25,4" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Name -->
  <text x="400" y="128" text-anchor="middle" fill="#d4a017" font-family="'JetBrains Mono', 'Courier New', Courier, monospace" font-size="28" font-weight="600" letter-spacing="8">CODY CHURCHWELL</text>

  <!-- Subtitle -->
  <text x="400" y="158" text-anchor="middle" fill="#808080" font-family="'JetBrains Mono', 'Courier New', Courier, monospace" font-size="11" letter-spacing="4">systems thinker  //  pattern hunter  //  owl</text>

  <!-- Thin bottom accent line -->
  <line x1="200" y1="190" x2="600" y2="190" stroke="#d4a017" stroke-width="0.5" opacity="0.3"/>
</svg>
