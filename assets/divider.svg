<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="presentation">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d4a017" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#d4a017" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rails -->
  <line x1="70" y1="12" x2="470" y2="12" stroke="url(#dl)" stroke-width="1"/>
  <line x1="530" y1="12" x2="930" y2="12" stroke="url(#dl)" stroke-width="1" transform="rotate(180 500 12)"/>

  <!-- owl-eye glyph -->
  <g fill="none" stroke="#d4a017" stroke-width="1">
    <circle cx="488" cy="12" r="4.2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="512" cy="12" r="4.2" opacity="0.7">
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="488" cy="12" r="1.3" fill="#d4a017"/>
  <circle cx="512" cy="12" r="1.3" fill="#d4a017"/>

  <!-- traveling scan dot -->
  <circle cy="12" r="2.4" fill="#4ade80" filter="url(#dg)">
    <animate attributeName="cx" values="70;930;70" keyTimes="0;0.5;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" keyTimes="0;0.05;0.5;0.95;1" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
